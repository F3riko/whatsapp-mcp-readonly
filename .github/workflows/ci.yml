name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The hardening relies on POSIX permissions and symlink semantics, and the
    # deployment target is linux/arm64, so those are the platforms tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Python adapter and entrypoint tests
        run: |
          python3 -m unittest tools/test_whisper_adapter.py
          python3 -m unittest discover -s deploy/docker -p 'test_*.py'
      - name: Shell syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/docker/smoke.sh
          sh -n deploy/docker/whisper-adapter

  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build linux targets with cgo disabled
        run: |
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./cmd/whatsapp-mcp
          done
